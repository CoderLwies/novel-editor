name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 无头 E2E（electron/verify.cjs）依赖 Electron 二进制与显示环境，
      # 本地以 `npx electron electron/verify.cjs` 为准，CI 暂不跑。
